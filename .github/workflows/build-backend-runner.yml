name: Build backend ARC runner

on:
  pull_request:
    paths:
      - images/backend-runner/**
      - .github/workflows/build-backend-runner.yml
  push:
    branches: [main]
    paths:
      - images/backend-runner/**
      - .github/workflows/build-backend-runner.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ci-runner-images/backend-runner

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Read runner base version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F= '/^ARG RUNNER_VERSION=/{print $2}' images/backend-runner/Dockerfile)"
          test -n "$version"
          echo "runner_version=$version" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: images/backend-runner
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          provenance: mode=max
          sbom: true
          build-args: |
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          tags: |
            ${{ env.IMAGE_NAME }}:runner-${{ steps.version.outputs.runner_version }}
            ${{ env.IMAGE_NAME }}:runner-${{ steps.version.outputs.runner_version }}-${{ steps.version.outputs.build_date }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend-runner
          cache-to: type=gha,mode=max,scope=backend-runner

      - name: Verify pull-request image contract
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --platform linux/amd64 \
            --entrypoint bash "${{ env.IMAGE_NAME }}:runner-${{ steps.version.outputs.runner_version }}" \
            -lc verify-backend-runner

      - name: Verify published image contract
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm --platform linux/amd64 \
            --entrypoint bash "${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" \
            -lc verify-backend-runner
